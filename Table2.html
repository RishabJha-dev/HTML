<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        td,
        th,
        tfoot {
            border: 1px solid black;
            border-collapse: collapse;
        }

</head>

            </tr>

                <th>begin</th>
                <th>end</th>

            </tr>
            <tr>
                <td rowspan="2">monday</td>

                <td rowspan="2">5 pm</td>
                <td>introduction</td>
            </tr>
            <tr>

                <td>validity</td>
            </tr>
            <tr>
                <td rowspan="3">tuesday</td>
                <td>8 am</td>
                <td>11 am</td>
                <td rowspan="2">xpath</td>
            </tr>
            <tr>

                <td>11 am</td>
                <td>2 pm</td>

            </tr>
            <tr>

                <td>2 pm</td>
                <td>5 pm</td>
                <td>xsl transformation</td>
            </tr>
            <tr>
                <td>wednesday</td>
                <td>8 am</td>

        </table>

</html>
